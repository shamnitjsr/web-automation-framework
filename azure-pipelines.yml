# PR / push  -> build image + smoke tests in one container
# Nightly or manual (runMode=kubernetes) -> sharded run on AKS
trigger:
  branches:
    include: [main, develop]

pr:
  branches:
    include: [main, develop]

schedules:
  - cron: "0 20 * * *"
    displayName: Nightly regression
    branches:
      include: [main]
    always: true

parameters:
  - name: runMode
    type: string
    default: docker
    values: [docker, kubernetes]
  - name: testGroups
    type: string
    default: smoke
  - name: shards
    type: number
    default: 4

variables:
  - group: web-automation-secrets      # USER_EMAIL, USER_PASSWORD, USER_NEGATIVE_EMAIL, USER_NEGATIVE_PASSWORD (secret)
  - name: acrName
    value: myregistry                   # TODO
  - name: image
    value: $(acrName).azurecr.io/web-automation:$(Build.BuildId)

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Build
    jobs:
      - job: BuildImage
        steps:
          - task: Docker@2
            displayName: Build and push image
            inputs:
              containerRegistry: acr-service-connection     # TODO: your service connection name
              repository: web-automation
              command: buildAndPush
              Dockerfile: Dockerfile
              tags: $(Build.BuildId)

  - stage: TestDocker
    displayName: Tests in Docker
    dependsOn: Build
    condition: and(succeeded(), or(ne(variables['Build.Reason'], 'Schedule'), eq('${{ parameters.runMode }}', 'docker')), eq('${{ parameters.runMode }}', 'docker'))
    jobs:
      - job: Run
        steps:
          - script: |
              mkdir -p results
              docker run --rm --ipc=host \
                -e TEST_ENV=qa -e TEST_GROUPS=${{ parameters.testGroups }} \
                -e USER_EMAIL -e USER_PASSWORD -e USER_NEGATIVE_EMAIL -e USER_NEGATIVE_PASSWORD \
                -e RESULTS_DIR=/results -e RUN_ID=$(Build.BuildId) \
                -v $PWD/results:/results $(image)
            displayName: Run tests
            env:
              USER_EMAIL: $(USER_EMAIL)
              USER_PASSWORD: $(USER_PASSWORD)
              USER_NEGATIVE_EMAIL: $(USER_NEGATIVE_EMAIL)
              USER_NEGATIVE_PASSWORD: $(USER_NEGATIVE_PASSWORD)
          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: 'results/**/surefire-reports/TEST-*.xml'
          - task: PublishBuildArtifacts@1
            condition: always()
            inputs:
              PathtoPublish: results
              ArtifactName: test-results

  - stage: TestKubernetes
    displayName: Sharded tests on AKS
    dependsOn: Build
    condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Schedule'), eq('${{ parameters.runMode }}', 'kubernetes')))
    jobs:
      - job: Run
        timeoutInMinutes: 90
        steps:
          - task: AzureCLI@2
            displayName: Run Indexed Job
            inputs:
              azureSubscription: azure-service-connection   # TODO
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az aks get-credentials -g my-rg -n my-aks --overwrite-existing      # TODO
                kubectl apply -f k8s/namespace-config.yaml -f k8s/results-pvc.yaml
                kubectl -n qa-automation create secret generic web-automation-secrets \
                  --from-literal=USER_EMAIL="$USER_EMAIL" --from-literal=USER_PASSWORD="$USER_PASSWORD" \
                  --from-literal=USER_NEGATIVE_EMAIL="$USER_NEGATIVE_EMAIL" \
                  --from-literal=USER_NEGATIVE_PASSWORD="$USER_NEGATIVE_PASSWORD" \
                  --dry-run=client -o yaml | kubectl apply -f -
                IMAGE="$(image)" RUN_ID="$(Build.BuildId)" SHARDS=${{ parameters.shards }} \
                  TEST_GROUPS="${{ parameters.testGroups }}" ./scripts/k8s-run.sh
            env:
              USER_EMAIL: $(USER_EMAIL)
              USER_PASSWORD: $(USER_PASSWORD)
              USER_NEGATIVE_EMAIL: $(USER_NEGATIVE_EMAIL)
              USER_NEGATIVE_PASSWORD: $(USER_NEGATIVE_PASSWORD)
